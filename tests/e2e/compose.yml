name: gchat-web-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gchat_web_test
      POSTGRES_PASSWORD: gchat_web_test_only
      POSTGRES_DB: gchat_web_test
    ports: ['127.0.0.1:55439:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gchat_web_test -d gchat_web_test']
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:8.2-alpine
    ports: ['127.0.0.1:56389:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 20
  coturn:
    image: coturn/coturn:4.18.0-r0
    ports:
      - '127.0.0.1:53479:3478/tcp'
      - '127.0.0.1:53479:3478/udp'
      - '127.0.0.1:55000-55039:55000-55039/udp'
    command:
      - '--no-tls'
      - '--fingerprint'
      - '--use-auth-secret'
      - '--static-auth-secret=gchat_web_test_turn_only'
      - '--realm=gchat-web-test'
      - '--listening-ip=0.0.0.0'
      - '--relay-ip=127.0.0.1'
      - '--external-ip=127.0.0.1'
      - '--min-port=55000'
      - '--max-port=55039'
      - '--allow-loopback-peers'
      - '--no-multicast-peers'
      - '--log-file=stdout'
      - '--verbose'
